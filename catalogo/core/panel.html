<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogos · panel</title>
<link id="favicon" rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --foco: #2a78d6;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --listo: #256abf; --verificar: #5598e7; --curso: #9ec5f4; --track: #cde2fb;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --good-text: #006300; --warning-text: #8a5a00; --serious-text: #9a3f1f;
    --tam: 15px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --foco: #86b6ef;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --listo: #3987e5; --verificar: #256abf; --curso: #1c5cab; --track: #104281;
      --good-text: #0ca30c; --warning-text: #fab219; --serious-text: #ec835a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --foco: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --listo: #3987e5; --verificar: #256abf; --curso: #1c5cab; --track: #104281;
    --good-text: #0ca30c; --warning-text: #fab219; --serious-text: #ec835a;
  }
  :root[data-grande="1"] { --tam: 17.5px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: var(--tam)/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .salto { position: absolute; left: -9999px; top: 8px; background: var(--surface); color: var(--ink); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); z-index: 10; }
  .salto:focus { left: 16px; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 6px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.35em; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 450; font-size: 0.65em; margin-left: 8px; }
  h2 { font-size: 0.87em; margin: 0 0 10px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .fila { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.87em; font-weight: 600; border: 1px solid var(--border); background: var(--surface); }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.trabajando .dot { background: var(--good); animation: latir 1.4s ease-in-out infinite; }
  .pill.pausado .dot, .pill.lotes .dot { background: var(--warning); }
  .pill.interrumpido .dot, .pill.desconectado .dot { background: var(--critical); }
  @keyframes latir { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
  @media (prefers-reduced-motion: reduce) { .pill .dot { animation: none !important; } .meter span { transition: none !important; } }
  button { font: inherit; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; min-height: 32px; }
  button:hover { color: var(--ink); }
  button[aria-pressed="true"] { color: var(--ink); border-color: var(--foco); box-shadow: inset 0 0 0 1px var(--foco); }
  .muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
  .hero { display: grid; grid-template-columns: minmax(180px, 260px) 1fr; gap: 20px; align-items: center; }
  .hero .numero { font-size: 3.7em; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .hero .numero small { font-size: 0.4em; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
  .meter { display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: var(--track); gap: 2px; }
  .meter span { display: block; height: 100%; min-width: 0; transition: width .4s ease; }
  .meter.fina { height: 10px; border-radius: 4px; }
  .leyenda { display: flex; gap: 14px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 0.87em; color: var(--ink-2); }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .leyenda b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .kpi .label { font-size: 0.87em; color: var(--ink-2); }
  .kpi .valor { font-size: 1.75em; font-weight: 650; letter-spacing: -0.01em; margin: 2px 0; white-space: nowrap; }
  .kpi .sub { font-size: 0.83em; color: var(--muted); }
  .kpi svg { display: block; width: 100%; height: 38px; margin-top: 6px; overflow: visible; }
  .dominios { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .dom .cab { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .dom .nombre { font-weight: 650; text-transform: capitalize; }
  .dom .nombre i, .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  .dom .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px; margin-top: 10px; font-size: 0.87em; }
  .dom .stats b { display: block; font-size: 1.2em; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dom .stats span { color: var(--muted); font-size: 0.9em; }
  .dos { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.6fr); gap: 16px; }
  @media (max-width: 820px) { .dos, .hero { grid-template-columns: 1fr; } }
  ul.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .dos ul.lista { max-height: 540px; overflow: auto; }
  ul.lista li { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; font-size: 0.9em; padding: 6px 8px; border-radius: 8px; }
  ul.lista li:nth-child(odd) { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  ul.lista .hora { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.92em; }
  ul.lista .titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.lista .titulo .dominio { color: var(--muted); font-size: 0.88em; margin-left: 6px; }
  ul.lista .meta { color: var(--muted); font-size: 0.92em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tipo { display: inline-flex; align-items: center; gap: 4px; font-size: 0.88em; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); }
  .tipo.listo { color: var(--good-text); } .tipo.verificar, .tipo.pausa { color: var(--warning-text); }
  .tipo.error, .tipo.tope_costo { color: var(--critical); } .tipo.reintento { color: var(--serious-text); }
  .tipo.novedad { color: var(--foco); } .tipo.lote_enviado, .tipo.lote_recibido, .tipo.fase, .tipo.fin { color: var(--ink-2); }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .filtros button { padding: 2px 10px; min-height: 26px; font-size: 0.92em; border-radius: 999px; }
  .vacio { color: var(--muted); font-size: 0.9em; padding: 8px 0; }
  details summary { cursor: pointer; color: var(--ink-2); font-size: 0.87em; }
  table { border-collapse: collapse; width: 100%; font-size: 0.87em; margin-top: 8px; }
  td, th { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  .tooltip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); font-size: 0.8em; padding: 4px 8px; border-radius: 6px; transform: translate(-50%, -130%); display: none; white-space: nowrap; }
  footer { color: var(--muted); font-size: 0.83em; display: flex; gap: 16px; flex-wrap: wrap; }
  .error-txt { color: var(--critical); }
  .novedades { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .nov { display: grid; gap: 8px; }
  .nov .cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .nov .cat { font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
  .nov .cat.novedad { color: var(--good-text); } .nov .cat.a_confirmar { color: var(--warning-text); }
  .nov .puntaje { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; font-size: 0.87em; color: var(--ink-2); }
  .nov .puntaje .track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .nov .puntaje .track span { display: block; height: 100%; background: var(--listo); }
  .nov .resumen { font-weight: 600; }
  .nov .motivos { display: flex; flex-wrap: wrap; gap: 4px; }
  .nov .motivos span { font-size: 0.8em; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .nov .motivos span.resta { color: var(--serious-text); }
  .nov .fuentes { font-size: 0.83em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nov .fuentes a { color: var(--ink-2); }
  .nov .acciones { display: flex; gap: 6px; justify-content: flex-end; }
  .nov .acciones button { padding: 2px 10px; min-height: 28px; font-size: 0.9em; }
  .contador { background: var(--foco); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 0.8em; font-weight: 700; }
  .vis-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<a class="salto" href="#actividad">Ir a la actividad</a>
<main>
  <header>
    <h1>Catálogos <small id="db"></small></h1>
    <div class="fila" role="toolbar" aria-label="Controles del panel">
      <span id="estado" class="pill inactivo" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="estado-txt">conectando…</span></span>
      <span id="actualizado" class="muted" style="font-size:0.87em" aria-hidden="true"></span>
      <button id="pausa" aria-pressed="false" title="Detener la actualización automática (útil con lector de pantalla)">⏸ pausar</button>
      <button id="aviso" aria-pressed="false" title="Notificación del navegador cuando termine la corrida">🔔 avisar al terminar</button>
      <button id="grande" aria-pressed="false" title="Texto más grande">A+</button>
      <button id="tema" title="Cambiar entre tema claro y oscuro">◐ tema</button>
    </div>
  </header>

  <section class="card hero" aria-labelledby="hero-titulo">
    <div>
      <h2 id="hero-titulo" class="vis-oculto">Avance total</h2>
      <div class="numero" aria-hidden="true"><span id="avance">0</span><small>%</small></div>
      <div class="ink2" id="avance-sub" aria-live="polite">del catálogo listo</div>
    </div>
    <div>
      <div class="meter" id="meter-total" role="img" aria-label="Progreso total"></div>
      <div class="leyenda" id="leyenda-total"></div>
    </div>
  </section>

  <section class="kpis" id="kpis" aria-label="Indicadores"></section>

  <section id="novedades-card" hidden>
    <h2>Novedades <span class="contador" id="n-novedades">0</span> <span class="muted" style="text-transform:none;font-weight:450;letter-spacing:0">cambios con motivo, no titulares</span></h2>
    <div class="novedades" id="novedades"></div>
  </section>

  <section>
    <h2>Por catálogo</h2>
    <div class="dominios" id="dominios"></div>
  </section>

  <section class="dos">
    <div class="card">
      <h2>En curso ahora <span class="muted" id="n-curso"></span></h2>
      <ul class="lista" id="en-curso"></ul>
    </div>
    <div class="card" id="actividad">
      <h2>Actividad <span class="filtros" id="filtros" role="group" aria-label="Filtrar por catálogo"></span></h2>
      <ul class="lista" id="eventos"></ul>
    </div>
  </section>

  <section class="card" id="lotes-card" hidden>
    <h2>Lotes abiertos</h2>
    <ul class="lista" id="lotes"></ul>
  </section>

  <section class="card" id="errores-card" hidden>
    <details><summary>Errores recientes</summary><ul class="lista" id="errores"></ul></details>
  </section>

  <footer id="pie"></footer>
</main>
<div class="tooltip" id="tooltip" role="tooltip"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s1)', 'var(--s2)', 'var(--s3)'];
  const ESTADOS = {
    trabajando: 'Trabajando', pausado: 'En pausa (límite de la API)', lotes: 'Esperando lotes',
    interrumpido: 'Corrida interrumpida', inactivo: 'Inactivo', desconectado: 'Sin conexión con el motor'
  };
  const COLOR_ESTADO = { trabajando: '#0ca30c', pausado: '#fab219', lotes: '#fab219', interrumpido: '#d03b3b', desconectado: '#d03b3b', inactivo: '#898781' };
  const TIPOS = {
    listo: '✓ listo', verificar: '◐ a verificar', error: '✕ error', reintento: '↻ reintento', pausa: '⏸ pausa',
    tope_costo: '⛔ tope de gasto', lote_enviado: '⇡ lote enviado', lote_recibido: '⇣ lote recibido', fase: '▸ fase', fin: '■ fin', novedad: '✦ novedad'
  };
  const CATEGORIAS = { novedad: '✦ Novedad', a_confirmar: '◐ A confirmar' };
  let swatches = {};
  let filtro = 'todos';
  let pausado = false;
  let avisar = false;
  let estadoAnterior = null;
  let ultimaActualizacion = 0;
  let serieActual = [];
  let ultimoDatos = null;
  const num = (n) => (n ?? 0).toLocaleString('es-AR');
  const usd = (n) => n == null ? '—' : 'US$ ' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: n < 1 ? 3 : 2 });
  const hora = (ts) => new Date(ts * 1000).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dur = (s) => {
    if (s == null) return '—';
    s = Math.round(s);
    if (s < 60) return s + ' s';
    if (s < 3600) return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
    return Math.floor(s / 3600) + ' h ' + String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ' min';
  };
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

  // Preferencias: tema y tamaño de texto. El botón manda; si no se tocó, sigue al sistema.
  if (leer('tema')) document.documentElement.dataset.theme = leer('tema');
  if (leer('grande') === '1') { document.documentElement.dataset.grande = '1'; $('grande').setAttribute('aria-pressed', 'true'); }
  $('tema').onclick = () => {
    const oscuro = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    const nuevo = oscuro ? 'light' : 'dark';
    document.documentElement.dataset.theme = nuevo;
    guardar('tema', nuevo);
  };
  $('grande').onclick = () => {
    const activo = document.documentElement.dataset.grande !== '1';
    document.documentElement.dataset.grande = activo ? '1' : '';
    $('grande').setAttribute('aria-pressed', String(activo));
    guardar('grande', activo ? '1' : '0');
  };
  $('pausa').onclick = () => {
    pausado = !pausado;
    $('pausa').setAttribute('aria-pressed', String(pausado));
    $('pausa').textContent = pausado ? '▶ reanudar' : '⏸ pausar';
    if (!pausado) actualizar();
  };
  $('aviso').onclick = async () => {
    if (!('Notification' in window)) { $('aviso').textContent = '🔔 sin soporte'; return; }
    if (!avisar && Notification.permission !== 'granted') {
      if ((await Notification.requestPermission()) !== 'granted') return;
    }
    avisar = !avisar;
    $('aviso').setAttribute('aria-pressed', String(avisar));
  };

  // Favicon por estado: el "iconito al lado del reloj", pero en la pestaña.
  function favicon(e) {
    const c = COLOR_ESTADO[e] || '#898781';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#1a1a19"/><circle cx="16" cy="16" r="9" fill="${c}"/></svg>`;
    $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  function meter(el, d) {
    const total = d.total || 1;
    const partes = [
      ['listas', d.listo, 'var(--listo)'], ['a verificar', d.verificar, 'var(--verificar)'],
      ['en curso o en lote', d.en_curso + d.en_lote, 'var(--curso)'], ['errores', d.error, 'var(--critical)']
    ];
    el.innerHTML = partes.filter(([, n]) => n > 0)
      .map(([k, n, c]) => `<span style="width:${(n / total * 100).toFixed(2)}%;background:${c}" title="${k}: ${num(n)}"></span>`).join('');
    el.setAttribute('aria-label', `${num(d.listo)} listas, ${num(d.verificar)} a verificar, ${num(d.en_curso + d.en_lote)} en curso, ${num(d.pendiente)} pendientes, ${num(d.error)} errores, de ${num(d.total)}`);
  }
  function leyenda(el, d) {
    const items = [
      ['var(--listo)', 'listas', d.listo], ['var(--verificar)', 'a verificar', d.verificar],
      ['var(--curso)', 'en curso / en lote', d.en_curso + d.en_lote], ['var(--track)', 'pendientes', d.pendiente],
      ['var(--critical)', '✕ errores', d.error]
    ];
    el.innerHTML = items.map(([c, l, n]) => `<span><i style="background:${c}" aria-hidden="true"></i>${l} <b>${num(n)}</b></span>`).join('');
  }

  function sparkline(serie) {
    const w = 200, h = 34, pad = 4;
    const vals = serie.map((p) => p.listos);
    const max = Math.max(1, ...vals);
    const x = (i) => pad + i * (w - 2 * pad) / (vals.length - 1);
    const y = (v) => h - pad - v * (h - 2 * pad) / max;
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const ult = vals.length - 1;
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Fichas por minuto en los últimos 30 minutos; máximo ${max}">
      <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--grid)" stroke-width="1"/>
      <polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
      <circle cx="${x(ult)}" cy="${y(vals[ult])}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
      ${vals.map((v, i) => `<rect x="${(x(i) - (w / vals.length) / 2).toFixed(1)}" y="0" width="${(w / vals.length).toFixed(1)}" height="${h}" fill="transparent" data-i="${i}"/>`).join('')}
    </svg>`;
  }
  function tablaSerie(serie) {
    const filas = serie.filter((p) => p.listos || p.errores).slice(-12);
    if (!filas.length) return '';
    return `<details><summary>ver tabla</summary><table><tr><th scope="col">minuto</th><th scope="col">listas</th><th scope="col">errores</th></tr>${
      filas.map((p) => `<tr><td>${hora(p.minuto).slice(0, 5)}</td><td>${p.listos}</td><td>${p.errores}</td></tr>`).join('')}</table></details>`;
  }
  function kpi(label, valor, sub, extra = '') {
    return `<div class="card kpi"><div class="label">${label}</div><div class="valor">${valor}</div><div class="sub">${sub}</div>${extra}</div>`;
  }

  function novedad(n) {
    const resta = (m) => /resta|anzuelo|no coinciden|una sola fuente|no cuenta|no es actualidad|puede revertirse|granja|solo hay movimiento/.test(m);
    const fuentes = (n.fuentes || []).map((f) => `<a href="${/^https?:/.test(f) ? esc(f) : 'https://' + esc(f)}" target="_blank" rel="noopener">${esc(f)}</a>`).join(' · ');
    return `<div class="card nov" data-id="${n.id}">
      <div class="cab"><span class="cat ${n.categoria}">${CATEGORIAS[n.categoria] || n.categoria}</span>
        <span class="muted" style="font-size:0.83em">${hora(n.detectada_en).slice(0, 5)} · <span class="swatch" style="background:${swatches[n.dominio] || 'var(--muted)'}" aria-hidden="true"></span>${esc(n.dominio)}</span></div>
      <div class="resumen">${esc(n.resumen)}</div>
      <div class="puntaje"><div class="track" role="img" aria-label="Puntaje ${n.puntaje} de 100"><span style="width:${n.puntaje}%"></span></div><span>${n.puntaje}/100</span></div>
      <div class="motivos">${(n.motivos || []).map((m) => `<span class="${resta(m) ? 'resta' : ''}">${esc(m)}</span>`).join('')}</div>
      ${fuentes ? `<div class="fuentes">${fuentes}</div>` : ''}
      <div class="acciones">
        <button data-accion="vista" aria-label="Marcar como vista: ${esc(n.titulo)}">✓ vista</button>
        <button data-accion="descartada" aria-label="Descartar: ${esc(n.titulo)}">✕ descartar</button>
      </div></div>`;
  }
  $('novedades').addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-accion]');
    if (!b) return;
    const card = b.closest('.nov');
    b.disabled = true;
    try {
      const r = await fetch(`/api/novedades/${card.dataset.id}/${b.dataset.accion}`, { method: 'POST' });
      if (r.ok) { card.remove(); actualizar(); } else { b.disabled = false; }
    } catch { b.disabled = false; }
  });

  function filtros(nombres) {
    const todos = ['todos', ...nombres];
    $('filtros').innerHTML = todos.map((n) =>
      `<button data-f="${esc(n)}" aria-pressed="${filtro === n}">${n === 'todos' ? 'todos' : `<span class="swatch" style="background:${swatches[n]}" aria-hidden="true"></span>${esc(n)}`}</button>`).join('');
  }
  $('filtros').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-f]');
    if (!b) return;
    filtro = b.dataset.f;
    if (ultimoDatos) render(ultimoDatos);
  });

  function render(d) {
    ultimoDatos = d;
    $('db').textContent = d.db;
    const t = d.totales;
    $('avance').textContent = Math.round(t.avance * 100);
    $('avance-sub').textContent = `${Math.round(t.avance * 100)} % · ${num(t.listo)} de ${num(t.total)} fichas listas`;
    meter($('meter-total'), t);
    leyenda($('leyenda-total'), t);

    const c = d.corrida;
    const costoFicha = t.analizados ? t.costo_usd / t.analizados : null;
    const busqFicha = t.analizados ? (t.busquedas / t.analizados).toFixed(1) : '—';
    $('kpis').innerHTML =
      kpi('Ritmo', `${d.ritmo_por_min.toLocaleString('es-AR', { maximumFractionDigits: 1 })} <span class="ink2" style="font-size:0.55em">fichas/min</span>`,
          'últimos 5 minutos', sparkline(d.serie) + tablaSerie(d.serie)) +
      kpi('Tiempo restante', d.eta_segundos != null ? dur(d.eta_segundos) : (d.restantes ? '—' : 'nada pendiente'),
          `${num(d.restantes)} por hacer`) +
      kpi('Costo acumulado', usd(t.costo_usd), costoFicha != null ? `${usd(costoFicha)} por ficha` : 'sin fichas analizadas') +
      kpi('En curso', num(t.en_curso), c ? `concurrencia ${c.concurrencia} · ${esc(c.analizador)}` : 'sin corrida') +
      kpi('Búsquedas web', num(t.busquedas), `${busqFicha} por ficha`) +
      kpi('Para revisar', num(t.confianza_baja), `confianza baja · ${num(t.error)} errores`);

    const nombres = Object.keys(d.dominios);
    nombres.forEach((n, i) => { swatches[n] = SERIES[i % SERIES.length]; });
    filtros(nombres);

    $('novedades-card').hidden = !d.novedades_total;
    $('n-novedades').textContent = num(d.novedades_total);
    $('novedades').innerHTML = d.novedades.map(novedad).join('');

    $('dominios').innerHTML = nombres.map((n) => {
      const x = d.dominios[n];
      return `<div class="card dom">
        <div class="cab"><span class="nombre"><i style="background:${swatches[n]}" aria-hidden="true"></i>${esc(n)}</span>
          <span class="ink2" style="font-variant-numeric:tabular-nums">${num(x.listo)} / ${num(x.total)}</span></div>
        <div class="meter fina" id="m-${esc(n)}" role="img"></div>
        <div class="stats">
          <div><b>${num(x.pendiente)}</b><span>pendientes</span></div>
          <div><b>${num(x.verificar)}</b><span>a verificar</span></div>
          <div><b>${num(x.error)}</b><span>errores</span></div>
          <div><b>${x.segundos_prom != null ? x.segundos_prom.toLocaleString('es-AR') + ' s' : '—'}</b><span>por ficha</span></div>
          <div><b>${usd(x.costo_usd)}</b><span>gastado</span></div>
          <div><b>${num(x.confianza_baja)}</b><span>para revisar</span></div>
        </div></div>`;
    }).join('') || '<div class="vacio">Todavía no hay items. Cargá datos con <code>catalogo ingerir</code>.</div>';
    nombres.forEach((n) => meter($(`m-${n}`), d.dominios[n]));

    const enCurso = d.en_curso.filter((e) => filtro === 'todos' || e.dominio === filtro);
    $('n-curso').textContent = enCurso.length ? `(${enCurso.length})` : '';
    $('en-curso').innerHTML = enCurso.map((e) =>
      `<li><span class="hora">${e.segundos != null ? dur(e.segundos) : ''}</span>
       <span class="titulo"><span class="swatch" style="background:${swatches[e.dominio] || 'var(--muted)'}" aria-hidden="true"></span>${esc(e.titulo)}<span class="dominio">${esc(e.dominio)}</span></span>
       <span class="meta">analizando…</span></li>`).join('') || '<li class="vacio">Nada en curso.</li>';

    const eventos = d.eventos.filter((e) => filtro === 'todos' || !e.dominio || e.dominio === filtro);
    $('eventos').innerHTML = eventos.map((e) => {
      const det = e.detalle || {};
      const titulo = det.resumen || det.titulo || e.clave || det.lote_id || (e.tipo === 'fase' ? `pasada ${det.numero} · ${num(det.items)} items` : '') || (e.tipo === 'fin' ? `corrida ${det.estado}` : '') || (e.tipo === 'pausa' ? `${det.segundos} s` : '');
      const meta = [det.segundos != null ? dur(det.segundos) : null, det.costo_usd != null ? usd(det.costo_usd) : null, det.busquedas ? `${det.busquedas} búsq.` : null, det.puntaje != null ? `${det.puntaje}/100` : null, det.refresco ? '↻ refresco' : null].filter(Boolean).join(' · ');
      const sw = e.dominio ? `<span class="swatch" style="background:${swatches[e.dominio] || 'var(--muted)'}" aria-hidden="true"></span>` : '';
      return `<li><span class="hora">${hora(e.ts)}</span>
        <span class="titulo">${sw}${esc(titulo)}${e.dominio ? `<span class="dominio">${esc(e.dominio)}</span>` : ''}${det.error ? ` <span class="error-txt">${esc(det.error.slice(0, 90))}</span>` : ''}</span>
        <span class="meta"><span class="tipo ${e.tipo}">${TIPOS[e.tipo] || e.tipo}</span> ${meta}</span></li>`;
    }).join('') || '<li class="vacio">Sin actividad todavía.</li>';

    $('lotes-card').hidden = !d.lotes.length;
    $('lotes').innerHTML = d.lotes.map((l) =>
      `<li><span class="hora">${hora(l.creado_en)}</span><span class="titulo">${esc(l.id)}<span class="dominio">${esc(l.dominio)}${l.con_web ? ' · con web' : ''}</span></span><span class="meta">${num(l.cantidad)} items</span></li>`).join('');

    $('errores-card').hidden = !d.errores_recientes.length;
    $('errores').innerHTML = d.errores_recientes.map((e) =>
      `<li><span class="hora">${hora(e.ts)}</span><span class="titulo">${esc((e.detalle || {}).titulo || e.clave)}<span class="dominio">${esc(e.dominio)}</span></span><span class="meta error-txt">${esc(((e.detalle || {}).error || '').slice(0, 120))}</span></li>`).join('');

    $('pie').innerHTML = c ? [
      `corrida #${c.id} · ${esc(c.modo)} · ${esc(c.analizador)}`, `inicio ${hora(c.inicio)}`,
      `duración ${dur((c.fin || d.hora) - c.inicio)}`, `${num(c.listos)} listas · ${num(c.errores)} errores · ${num(c.reintentos)} reintentos`,
      `dominios: ${esc(JSON.parse(c.dominios).join(', '))}`
    ].map((x) => `<span>${x}</span>`).join('') : '<span>Sin corridas registradas.</span>';

    estado(d.estado, d);
    ultimaActualizacion = Date.now();
    serieActual = d.serie;
  }

  function estado(e, d) {
    const pill = $('estado');
    pill.className = 'pill ' + e;
    $('estado-txt').textContent = ESTADOS[e] || e;
    favicon(e);
    const avance = d ? `${Math.round(d.totales.avance * 100)} % · ` : '';
    const nov = d && d.novedades_total ? ` · ${d.novedades_total} novedad${d.novedades_total === 1 ? '' : 'es'}` : '';
    document.title = (e === 'trabajando' ? '● ' : '') + avance + 'Catálogos' + nov;
    if (avisar && estadoAnterior === 'trabajando' && e !== 'trabajando' && e !== 'pausado' && 'Notification' in window && Notification.permission === 'granted') {
      new Notification('Catálogos: corrida terminada', { body: d ? `${num(d.totales.listo)} fichas listas · ${usd(d.totales.costo_usd)}` : '' });
    }
    estadoAnterior = e;
  }

  // Tooltip de la gráfica de ritmo (con mouse; la tabla cubre teclado y lector de pantalla).
  const tooltip = $('tooltip');
  document.addEventListener('mousemove', (ev) => {
    const r = ev.target.closest && ev.target.closest('rect[data-i]');
    if (!r || !serieActual.length) { tooltip.style.display = 'none'; return; }
    const p = serieActual[+r.dataset.i];
    tooltip.textContent = `${hora(p.minuto).slice(0, 5)} · ${p.listos} ficha${p.listos === 1 ? '' : 's'}${p.errores ? ` · ${p.errores} error${p.errores === 1 ? '' : 'es'}` : ''}`;
    tooltip.style.display = 'block';
    tooltip.style.left = ev.clientX + 'px';
    tooltip.style.top = ev.clientY + 'px';
  });

  async function actualizar() {
    if (pausado) return;
    try {
      const r = await fetch('/api/estado', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch (e) {
      estado('desconectado', ultimoDatos);
    }
  }
  setInterval(() => {
    if (ultimaActualizacion) $('actualizado').textContent = pausado ? 'actualización pausada' : `actualizado hace ${Math.round((Date.now() - ultimaActualizacion) / 1000)} s`;
  }, 1000);
  actualizar();
  setInterval(actualizar, 2000);
})();
</script>
</body>
</html>
