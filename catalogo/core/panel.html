<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogos · panel</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --listo: #256abf; --verificar: #5598e7; --curso: #9ec5f4; --track: #cde2fb;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --listo: #3987e5; --verificar: #256abf; --curso: #1c5cab; --track: #104281;
      --good-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --listo: #3987e5; --verificar: #256abf; --curso: #1c5cab; --track: #104281;
    --good-text: #0ca30c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 450; font-size: 13px; margin-left: 8px; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .fila { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.trabajando .dot { background: var(--good); animation: latir 1.4s ease-in-out infinite; }
  .pill.pausado .dot, .pill.lotes .dot { background: var(--warning); }
  .pill.interrumpido .dot, .pill.desconectado .dot { background: var(--critical); }
  @keyframes latir { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
  button { font: inherit; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { color: var(--ink); }
  .muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
  .hero { display: grid; grid-template-columns: minmax(180px, 260px) 1fr; gap: 20px; align-items: center; }
  .hero .numero { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .hero .numero small { font-size: 22px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
  .meter { display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: var(--track); gap: 2px; }
  .meter span { display: block; height: 100%; min-width: 0; transition: width .4s ease; }
  .meter.fina { height: 10px; border-radius: 4px; }
  .leyenda { display: flex; gap: 14px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .leyenda b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .kpi .label { font-size: 13px; color: var(--ink-2); }
  .kpi .valor { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin: 2px 0; white-space: nowrap; }
  .kpi .sub { font-size: 12.5px; color: var(--muted); }
  .kpi svg { display: block; width: 100%; height: 38px; margin-top: 6px; overflow: visible; }
  .dominios { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .dom .cab { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .dom .nombre { font-weight: 650; text-transform: capitalize; }
  .dom .nombre i, .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  .dom .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px; margin-top: 10px; font-size: 13px; }
  .dom .stats b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dom .stats span { color: var(--muted); font-size: 12px; }
  .dos { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.6fr); gap: 16px; }
  @media (max-width: 820px) { .dos, .hero { grid-template-columns: 1fr; } }
  ul.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .dos ul.lista { max-height: 540px; overflow: auto; }
  ul.lista li { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; padding: 6px 8px; border-radius: 8px; }
  ul.lista li:nth-child(odd) { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  ul.lista .hora { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  ul.lista .titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.lista .titulo .dominio { color: var(--muted); font-size: 12px; margin-left: 6px; }
  ul.lista .meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tipo { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); }
  .tipo.listo { color: var(--good-text); } .tipo.verificar { color: #8a5a00; } .tipo.error, .tipo.tope_costo { color: var(--critical); }
  .tipo.reintento { color: #9a3f1f; } .tipo.pausa { color: #8a5a00; } .tipo.lote_enviado, .tipo.lote_recibido, .tipo.fase, .tipo.fin { color: var(--ink-2); }
  :root[data-theme="dark"] .tipo.verificar, :root[data-theme="dark"] .tipo.pausa { color: var(--warning); }
  :root[data-theme="dark"] .tipo.reintento { color: var(--serious); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tipo.verificar, :root:not([data-theme="light"]) .tipo.pausa { color: var(--warning); } :root:not([data-theme="light"]) .tipo.reintento { color: var(--serious); } }
  .vacio { color: var(--muted); font-size: 13.5px; padding: 8px 0; }
  details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
  td, th { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  .tooltip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12px; padding: 4px 8px; border-radius: 6px; transform: translate(-50%, -130%); display: none; white-space: nowrap; }
  footer { color: var(--muted); font-size: 12.5px; display: flex; gap: 16px; flex-wrap: wrap; }
  .error-txt { color: var(--critical); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Catálogos <small id="db"></small></h1>
    <div class="fila">
      <span id="estado" class="pill inactivo"><span class="dot"></span><span id="estado-txt">conectando…</span></span>
      <span id="actualizado" class="muted" style="font-size:13px"></span>
      <button id="tema" title="Cambiar tema">◐ tema</button>
    </div>
  </header>

  <section class="card hero">
    <div>
      <div class="numero"><span id="avance">0</span><small>%</small></div>
      <div class="ink2" id="avance-sub">del catálogo listo</div>
    </div>
    <div>
      <div class="meter" id="meter-total" aria-label="Progreso total"></div>
      <div class="leyenda" id="leyenda-total"></div>
    </div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section>
    <h2>Por catálogo</h2>
    <div class="dominios" id="dominios"></div>
  </section>

  <section class="dos">
    <div class="card">
      <h2>En curso ahora <span class="muted" id="n-curso"></span></h2>
      <ul class="lista" id="en-curso"></ul>
    </div>
    <div class="card">
      <h2>Actividad</h2>
      <ul class="lista" id="eventos"></ul>
    </div>
  </section>

  <section class="card" id="lotes-card" hidden>
    <h2>Lotes abiertos</h2>
    <ul class="lista" id="lotes"></ul>
  </section>

  <section class="card" id="errores-card" hidden>
    <details><summary>Errores recientes</summary><ul class="lista" id="errores"></ul></details>
  </section>

  <footer id="pie"></footer>
</main>
<div class="tooltip" id="tooltip"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s1)', 'var(--s2)', 'var(--s3)'];
  const ESTADOS = {
    trabajando: 'Trabajando', pausado: 'En pausa (límite de la API)', lotes: 'Esperando lotes',
    interrumpido: 'Corrida interrumpida', inactivo: 'Inactivo', desconectado: 'Sin conexión con el motor'
  };
  const TIPOS = {
    listo: '✓ listo', verificar: '◐ a verificar', error: '✕ error', reintento: '↻ reintento', pausa: '⏸ pausa',
    tope_costo: '⛔ tope de gasto', lote_enviado: '⇡ lote enviado', lote_recibido: '⇣ lote recibido', fase: '▸ fase', fin: '■ fin'
  };
  let swatches = {};
  const num = (n) => (n ?? 0).toLocaleString('es-AR');
  const usd = (n) => n == null ? '—' : 'US$ ' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: n < 1 ? 3 : 2 });
  const hora = (ts) => new Date(ts * 1000).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dur = (s) => {
    if (s == null) return '—';
    s = Math.round(s);
    if (s < 60) return s + ' s';
    if (s < 3600) return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
    return Math.floor(s / 3600) + ' h ' + String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ' min';
  };
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Tema: el botón manda; si no se tocó, sigue al sistema.
  const guardado = (() => { try { return localStorage.getItem('tema'); } catch { return null; } })();
  if (guardado) document.documentElement.dataset.theme = guardado;
  $('tema').onclick = () => {
    const oscuro = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    const nuevo = oscuro ? 'light' : 'dark';
    document.documentElement.dataset.theme = nuevo;
    try { localStorage.setItem('tema', nuevo); } catch {}
  };

  function meter(el, d) {
    const total = d.total || 1;
    const partes = [
      ['listo', d.listo, 'var(--listo)'], ['verificar', d.verificar, 'var(--verificar)'],
      ['curso', d.en_curso + d.en_lote, 'var(--curso)'], ['error', d.error, 'var(--critical)']
    ];
    el.innerHTML = partes.filter(([, n]) => n > 0)
      .map(([k, n, c]) => `<span style="width:${(n / total * 100).toFixed(2)}%;background:${c}" title="${k}: ${num(n)}"></span>`).join('');
  }
  function leyenda(el, d) {
    const items = [
      ['var(--listo)', 'listas', d.listo], ['var(--verificar)', 'a verificar', d.verificar],
      ['var(--curso)', 'en curso / en lote', d.en_curso + d.en_lote], ['var(--track)', 'pendientes', d.pendiente],
      ['var(--critical)', '✕ errores', d.error]
    ];
    el.innerHTML = items.map(([c, l, n]) => `<span><i style="background:${c}"></i>${l} <b>${num(n)}</b></span>`).join('');
  }

  function sparkline(serie) {
    const w = 200, h = 34, pad = 4;
    const vals = serie.map((p) => p.listos);
    const max = Math.max(1, ...vals);
    const x = (i) => pad + i * (w - 2 * pad) / (vals.length - 1);
    const y = (v) => h - pad - v * (h - 2 * pad) / max;
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const ult = vals.length - 1;
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" data-serie>
      <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--grid)" stroke-width="1"/>
      <polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
      <circle cx="${x(ult)}" cy="${y(vals[ult])}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
      ${vals.map((v, i) => `<rect x="${(x(i) - (w / vals.length) / 2).toFixed(1)}" y="0" width="${(w / vals.length).toFixed(1)}" height="${h}" fill="transparent" data-i="${i}"/>`).join('')}
    </svg>`;
  }
  function tablaSerie(serie) {
    const filas = serie.filter((p) => p.listos || p.errores).slice(-12);
    if (!filas.length) return '';
    return `<details><summary>ver tabla</summary><table><tr><th>minuto</th><th>listas</th><th>errores</th></tr>${
      filas.map((p) => `<tr><td>${hora(p.minuto).slice(0, 5)}</td><td>${p.listos}</td><td>${p.errores}</td></tr>`).join('')}</table></details>`;
  }

  function kpi(label, valor, sub, extra = '') {
    return `<div class="card kpi"><div class="label">${label}</div><div class="valor">${valor}</div><div class="sub">${sub}</div>${extra}</div>`;
  }

  function render(d) {
    $('db').textContent = d.db;
    const t = d.totales;
    $('avance').textContent = Math.round(t.avance * 100);
    $('avance-sub').textContent = `${num(t.listo)} de ${num(t.total)} fichas listas`;
    meter($('meter-total'), t);
    leyenda($('leyenda-total'), t);

    const c = d.corrida;
    const costoFicha = t.analizados ? t.costo_usd / t.analizados : null;
    const busqFicha = t.analizados ? (t.busquedas / t.analizados).toFixed(1) : '—';
    $('kpis').innerHTML =
      kpi('Ritmo', `${d.ritmo_por_min.toLocaleString('es-AR', { maximumFractionDigits: 1 })} <span class="ink2" style="font-size:15px">fichas/min</span>`,
          'últimos 5 minutos', sparkline(d.serie) + tablaSerie(d.serie)) +
      kpi('Tiempo restante', d.eta_segundos != null ? dur(d.eta_segundos) : (d.restantes ? '—' : 'nada pendiente'),
          `${num(d.restantes)} por hacer`) +
      kpi('Costo acumulado', usd(t.costo_usd), costoFicha != null ? `${usd(costoFicha)} por ficha` : 'sin fichas analizadas') +
      kpi('En curso', num(t.en_curso), c ? `concurrencia ${c.concurrencia} · ${c.analizador}` : 'sin corrida') +
      kpi('Búsquedas web', num(t.busquedas), `${busqFicha} por ficha`) +
      kpi('Para revisar', num(t.confianza_baja), `confianza baja · ${num(t.error)} errores`);

    const nombres = Object.keys(d.dominios);
    nombres.forEach((n, i) => { swatches[n] = SERIES[i % SERIES.length]; });
    $('dominios').innerHTML = nombres.map((n) => {
      const x = d.dominios[n];
      return `<div class="card dom">
        <div class="cab"><span class="nombre"><i style="background:${swatches[n]}"></i>${esc(n)}</span>
          <span class="ink2" style="font-variant-numeric:tabular-nums">${num(x.listo)} / ${num(x.total)}</span></div>
        <div class="meter fina" id="m-${esc(n)}"></div>
        <div class="stats">
          <div><b>${num(x.pendiente)}</b><span>pendientes</span></div>
          <div><b>${num(x.verificar)}</b><span>a verificar</span></div>
          <div><b>${num(x.error)}</b><span>errores</span></div>
          <div><b>${x.segundos_prom != null ? x.segundos_prom.toLocaleString('es-AR') + ' s' : '—'}</b><span>por ficha</span></div>
          <div><b>${usd(x.costo_usd)}</b><span>gastado</span></div>
          <div><b>${num(x.confianza_baja)}</b><span>para revisar</span></div>
        </div></div>`;
    }).join('') || '<div class="vacio">Todavía no hay items. Cargá datos con <code>catalogo ingerir</code>.</div>';
    nombres.forEach((n) => meter($(`m-${n}`), d.dominios[n]));

    $('n-curso').textContent = d.en_curso.length ? `(${d.en_curso.length})` : '';
    $('en-curso').innerHTML = d.en_curso.map((e) =>
      `<li><span class="hora">${e.segundos != null ? dur(e.segundos) : ''}</span>
       <span class="titulo"><span class="swatch" style="background:${swatches[e.dominio] || 'var(--muted)'}"></span>${esc(e.titulo)}<span class="dominio">${esc(e.dominio)}</span></span>
       <span class="meta">analizando…</span></li>`).join('') || '<li class="vacio">Nada en curso.</li>';

    $('eventos').innerHTML = d.eventos.map((e) => {
      const det = e.detalle || {};
      const titulo = det.titulo || e.clave || (det.lote_id ? det.lote_id : '') || (e.tipo === 'fase' ? `pasada ${det.numero} · ${num(det.items)} items` : '') || (e.tipo === 'fin' ? `corrida ${det.estado}` : '') || (e.tipo === 'pausa' ? `${det.segundos} s` : '');
      const meta = [det.segundos != null ? dur(det.segundos) : null, det.costo_usd != null ? usd(det.costo_usd) : null, det.busquedas ? `${det.busquedas} búsq.` : null].filter(Boolean).join(' · ');
      const sw = e.dominio ? `<span class="swatch" style="background:${swatches[e.dominio] || 'var(--muted)'}"></span>` : '';
      return `<li><span class="hora">${hora(e.ts)}</span>
        <span class="titulo">${sw}${esc(titulo)}${e.dominio ? `<span class="dominio">${esc(e.dominio)}</span>` : ''}${det.error ? ` <span class="error-txt">${esc(det.error.slice(0, 90))}</span>` : ''}</span>
        <span class="meta"><span class="tipo ${e.tipo}">${TIPOS[e.tipo] || e.tipo}</span> ${meta}</span></li>`;
    }).join('') || '<li class="vacio">Sin actividad todavía.</li>';

    $('lotes-card').hidden = !d.lotes.length;
    $('lotes').innerHTML = d.lotes.map((l) =>
      `<li><span class="hora">${hora(l.creado_en)}</span><span class="titulo">${esc(l.id)}<span class="dominio">${esc(l.dominio)}${l.con_web ? ' · con web' : ''}</span></span><span class="meta">${num(l.cantidad)} items</span></li>`).join('');

    $('errores-card').hidden = !d.errores_recientes.length;
    $('errores').innerHTML = d.errores_recientes.map((e) =>
      `<li><span class="hora">${hora(e.ts)}</span><span class="titulo">${esc((e.detalle || {}).titulo || e.clave)}<span class="dominio">${esc(e.dominio)}</span></span><span class="meta error-txt">${esc(((e.detalle || {}).error || '').slice(0, 120))}</span></li>`).join('');

    $('pie').innerHTML = c ? [
      `corrida #${c.id} · ${esc(c.modo)} · ${esc(c.analizador)}`, `inicio ${hora(c.inicio)}`,
      `duración ${dur((c.fin || d.hora) - c.inicio)}`, `${num(c.listos)} listas · ${num(c.errores)} errores · ${num(c.reintentos)} reintentos`,
      `dominios: ${esc(JSON.parse(c.dominios).join(', '))}`
    ].map((x) => `<span>${x}</span>`).join('') : '<span>Sin corridas registradas.</span>';

    estado(d.estado);
    ultimaActualizacion = Date.now();
    serieActual = d.serie;
  }

  function estado(e) {
    const pill = $('estado');
    pill.className = 'pill ' + e;
    $('estado-txt').textContent = ESTADOS[e] || e;
    document.title = (e === 'trabajando' ? '● ' : '') + 'Catálogos · ' + (ESTADOS[e] || e);
  }

  // Tooltip de la gráfica de ritmo.
  let serieActual = [];
  const tooltip = $('tooltip');
  document.addEventListener('mousemove', (ev) => {
    const r = ev.target.closest && ev.target.closest('rect[data-i]');
    if (!r || !serieActual.length) { tooltip.style.display = 'none'; return; }
    const p = serieActual[+r.dataset.i];
    tooltip.textContent = `${hora(p.minuto).slice(0, 5)} · ${p.listos} ficha${p.listos === 1 ? '' : 's'}${p.errores ? ` · ${p.errores} error${p.errores === 1 ? '' : 'es'}` : ''}`;
    tooltip.style.display = 'block';
    tooltip.style.left = ev.clientX + 'px';
    tooltip.style.top = ev.clientY + 'px';
  });

  let ultimaActualizacion = 0;
  async function actualizar() {
    try {
      const r = await fetch('/api/estado', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch (e) {
      estado('desconectado');
    }
  }
  setInterval(() => {
    if (ultimaActualizacion) $('actualizado').textContent = `actualizado hace ${Math.round((Date.now() - ultimaActualizacion) / 1000)} s`;
  }, 1000);
  actualizar();
  setInterval(actualizar, 2000);
})();
</script>
</body>
</html>
