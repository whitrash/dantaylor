[project]
name = "catalogo"
version = "0.1.0"
description = "Motor compartido para recolectar, analizar en paralelo y ordenar catálogos (visual y de comercios)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
catalogo = "catalogo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catalogo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# Los prompts y las listas de palabras clave se leen mejor en una sola línea.
ignore = ["E501"]
